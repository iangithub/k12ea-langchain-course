[project]
name = "school-ai-agent-day2"
version = "0.1.0"
description = "Day 2 examples for school RAG and LangGraph agents"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=1.2,<2",
    "langchain-google-genai>=4,<5",
    "langchain-openai>=1.1,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "pypdf>=6,<7",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.16,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]