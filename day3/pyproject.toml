[project]
name = "school-ai-agent-day3"
version = "0.1.0"
description = "Day 3 examples for a RAG LINE Bot, agents, LangGraph, and Ollama"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "langchain>=1.2,<2",
    "langchain-google-genai>=4,<5",
    "langchain-ollama>=1,<2",
    "langchain-openai>=1.1,<2",
    "langchain-qdrant>=1.1,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "line-bot-sdk>=3.17,<4",
    "openai>=1.100,<3",
    "pydantic>=2.12,<3",
    "pypdf>=6,<7",
    "python-dotenv>=1.2,<2",
    "qdrant-client>=1.16,<2",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["examples"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
